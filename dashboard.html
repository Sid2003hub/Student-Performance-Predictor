<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student dashboard for AI performance predictions.">
    <title>Dashboard · AI Predictor</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body data-auth-required="true">
<header>
    <a class="logo" href="/"><i class="fa-solid fa-graduation-cap"></i><h2>AI Predictor</h2></a>
    <nav><a href="/prediction.html">Prediction</a><a href="/" data-logout>Logout</a></nav>
</header>
<main class="dashboard">
    <div class="welcome-row"><div><span class="eyebrow">STUDENT DASHBOARD</span><h1>Welcome, <span id="userName">Student</span> 👋</h1></div><a class="primary-link" href="/prediction.html">New Prediction <i class="fa-solid fa-arrow-right"></i></a></div>
    <div class="dashboard-grid">
        <div class="dashboard-card action-card"><div class="icon-box"><i class="fa-solid fa-brain"></i></div><h2>AI Performance Prediction</h2><p>Enter attendance, study hours and academic scores to receive a Pass/Fail prediction with confidence.</p><a class="button-link" href="/prediction.html">Start Prediction</a></div>
        <div class="dashboard-card"><h2>Recent Predictions</h2><div id="historyList"><p class="muted">Loading history...</p></div></div>
    </div>
</main>
<script src="/script.js"></script>
</body>
</html>
