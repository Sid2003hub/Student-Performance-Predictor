<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create an account for the AI Student Performance Predictor.">
    <title>Create Account · AI Predictor</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
        <i class="fa-solid fa-user-plus login-icon"></i>
        <h2>Create Account</h2><p class="card-subtitle">Create your student account to start predicting.</p>
        <form id="registerForm" novalidate>
            <label for="name">Full Name</label><input type="text" id="name" placeholder="Enter your name" autocomplete="name" maxlength="100" required>
            <label for="email">Email</label><input type="email" id="email" placeholder="Enter email" autocomplete="email" required>
            <label for="password">Password</label><input type="password" id="password" placeholder="Minimum 8 characters" autocomplete="new-password" minlength="8" required>
            <label for="confirmPassword">Confirm Password</label><input type="password" id="confirmPassword" placeholder="Repeat password" autocomplete="new-password" minlength="8" required>
            <button type="submit">Create Account</button>
            <p id="registerMessage" class="form-message" hidden></p>
        </form>
        <p class="switch-auth">Already have an account? <a href="/login.html">Login</a></p>
    </div>
</div>
<script src="/script.js"></script>
</body>
</html>
