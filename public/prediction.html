<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Predict a student's academic performance with the AI model.">
    <title>Prediction · AI Predictor</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body data-auth-required="true">
<header>
    <a class="logo" href="/"><i class="fa-solid fa-graduation-cap"></i><h2>AI Predictor</h2></a>
    <nav><a href="/dashboard.html">Dashboard</a><a href="/" data-logout>Logout</a></nav>
</header>
<main class="prediction-container">
    <div class="prediction-card">
        <div class="section-heading"><span class="eyebrow">AI ANALYSIS</span><h1>Student Performance Prediction</h1><p>Provide the student's academic information below.</p></div>
        <form id="predictionForm" novalidate>
            <div class="input-grid">
                <div class="field full"><label for="name">Student Name</label><input type="text" id="name" placeholder="Student name" maxlength="100" required></div>
                <div class="field"><label for="attendance">Attendance (%)</label><input type="number" id="attendance" min="0" max="100" step="0.1" placeholder="e.g. 85" required></div>
                <div class="field"><label for="studyHours">Study Hours / Day</label><input type="number" id="studyHours" min="0" max="24" step="0.1" placeholder="e.g. 4" required></div>
                <div class="field"><label for="previousMarks">Previous Marks (%)</label><input type="number" id="previousMarks" min="0" max="100" step="0.1" placeholder="e.g. 75" required></div>
                <div class="field"><label for="internalMarks">Internal Marks (%)</label><input type="number" id="internalMarks" min="0" max="100" step="0.1" placeholder="e.g. 22" required></div>
                <div class="field full"><label for="assignments">Assignments Completed</label><input type="number" id="assignments" min="0" max="100" step="1" placeholder="e.g. 7" required></div>
            </div>
            <button class="full-button" type="submit"><i class="fa-solid fa-wand-magic-sparkles"></i> Predict Result</button>
            <p id="predictionMessage" class="form-message" hidden></p>
        </form>
    </div>
</main>
<script src="/script.js"></script>
</body>
</html>
