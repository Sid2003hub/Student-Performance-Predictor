<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student performance prediction result.">
    <title>Result · AI Predictor</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-auth-required="true">
<main class="result-page">
    <div class="result-card">
        <span class="eyebrow">AI ANALYSIS COMPLETE</span>
        <h1>Prediction Result</h1>
        <p class="result-student" id="studentText"></p>
        <div id="resultBadge" class="result-badge"></div>
        <div class="confidence"><span>Model Confidence</span><strong id="confidenceText">--</strong></div>
        <div class="result-actions"><a class="button-link" href="/prediction.html">Predict Again</a><a class="secondary-button" href="/dashboard.html">Dashboard</a></div>
        <p class="disclaimer">This prediction is based on the trained machine-learning model and should be used as an academic guidance tool, not as a definitive outcome.</p>
    </div>
</main>
<script>
const prediction = localStorage.getItem("prediction");
const confidence = localStorage.getItem("confidence");
const studentName = localStorage.getItem("studentName");
const badge = document.getElementById("resultBadge");
const confidenceText = document.getElementById("confidenceText");
const studentText = document.getElementById("studentText");

if (!prediction || confidence === null) {
    window.location.href = "/prediction.html";
} else {
    badge.textContent = prediction;
    badge.classList.add(prediction.toLowerCase());
    confidenceText.textContent = `${Number(confidence).toFixed(2)}%`;
    studentText.textContent = studentName ? `Student: ${studentName}` : "Prediction generated successfully";
}
</script>
<script src="/script.js"></script>
</body>
</html>
